name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build:sunrise-sunset
        env:
          REACT_APP_API_AUTHORIZATION_KEY: ${{ secrets.REACT_APP_API_AUTHORIZATION_KEY }}
      - run: npm run build
        env:
          REACT_APP_API_AUTHORIZATION_KEY: ${{ secrets.REACT_APP_API_AUTHORIZATION_KEY }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
